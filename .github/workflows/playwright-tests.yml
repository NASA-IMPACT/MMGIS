name: Playwright Tests

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

jobs:
  # Unit tests (Vitest + jsdom, no DB/browser). Run once, outside the matrix:
  # they already cover both modes in a single run by reloading the mode module
  # per test. See tests/unit/deploymentMode.spec.js and bakeGuards.spec.js.
  unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npx vitest run

  # Committed mission configs are generated from tool `defaults` blocks + profiles,
  # never hand-edited. Regenerate every profile and fail if the committed artifact
  # is stale — the regenerated diff is the review artifact (see ADR
  # docs/adr/20260716-generated-mission-configs.md).
  config-generation:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate mission configs
        run: |
          node scripts/generate-mission-config.js full-demo
          node scripts/generate-mission-config.js minimal

      - name: Fail if committed configs are stale
        run: |
          if ! git diff --exit-code -- \
            mission-profiles/generated/full-demo-mission.json \
            API/templates/config_template.json; then
            echo "::error::Committed mission configs are out of date. Regenerate with:"
            echo "::error::  node scripts/generate-mission-config.js full-demo"
            echo "::error::  node scripts/generate-mission-config.js minimal"
            echo "::error::then commit mission-profiles/generated/full-demo-mission.json and API/templates/config_template.json"
            exit 1
          fi

  # E2e tests boot the real app. Mode is fixed at process start, so we boot once
  # per mode via the matrix. MMGIS_DEPLOYMENT_MODE is written into .env below.
  test:
    name: e2e (${{ matrix.mode }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: unit

    strategy:
      fail-fast: false
      matrix:
        mode: [full, lean]

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: mmgis_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup test environment
        run: |
          cp sample.env .env || touch .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=8888" >> .env
          echo "AUTH=off" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=mmgis_test" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASS=test_password" >> .env
          echo "ENABLE_MMGIS_WEBSOCKETS=false" >> .env
          echo "ENABLE_CONFIG_WEBSOCKETS=false" >> .env
          echo "HIDE_CONFIG=true" >> .env
          echo "MMGIS_DEPLOYMENT_MODE=${{ matrix.mode }}" >> .env

      # Append the sidecar WITH_* flags implied by the deployment mode, derived
      # from capabilities.js (the one definition the app reads) rather than
      # hand-listed here. In lean this disables the sidecars so init-db/boot
      # don't reach services the lean topology doesn't deploy; in full it appends
      # nothing and sample.env stands.
      - name: Generate mode-derived sidecar env
        run: node scripts/mode-env.js >> .env

      # In lean, this step also proves the spatial-catalog (mmgis-stac) DB is
      # NOT created (it's gated on the localSidecars capability).
      - name: Initialize Database
        run: node scripts/init-db.js

      # A feature gated OFF in the current mode still keeps its DB tables (both
      # directions: datasets/geodatasets/draw/shortener off in lean, deployments
      # off in full). Models always register; only routes are gated (ADR D2).
      # Fails CI if an expected table is missing.
      - name: Assert gated tables exist
        run: node tests/ci/assert-gated-tables.js

      # Must build before the server starts: the e2e tests hit `/`, which 500s
      # without build/index.pug.
      - name: Build frontend
        # CI=false: GitHub sets CI=true, which makes react-scripts fail on MMGIS's
        # intentional build warnings. The production Dockerfile builds with CI unset.
        run: npm run build
        env:
          CI: false

      # Legacy smoke / event-bus specs. Gating (no continue-on-error), matching
      # their pre-matrix behavior on development — a real regression here fails
      # the leg. They boot the same app per mode, so they also confirm smoke +
      # event bus pass under lean, not just full.
      - name: Run legacy E2E Tests
        run: npx playwright test tests/e2e/smoke.spec.js tests/e2e/eventbus-integration.spec.js --project=chromium

      # Gating check: each feature's route must be mounted (non-404) in its mode
      # and absent (404) otherwise. Checks mount vs. 404 only, not behavior. No
      # continue-on-error, so mis-gating fails the leg.
      - name: Run deployment-mode shape check (gating)
        run: npx playwright test tests/e2e/deployment-mode.spec.js --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.mode }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.mode }}
          path: test-results/
          retention-days: 7
