name: Deploy production

# The production environment's trigger. Like its development sibling it holds
# no deployment logic of its own: it decides WHEN and in WHICH MODE the two
# shared engines run, and wires the infrastructure engine's outputs into the
# app engine. Merging to `production` expresses intent; it does not deploy.
#
#   changes -> iac-deploy.yml (always) -> app-deploy.yml (every merge)
#
# ── Invariants for anyone editing this file ──────────────────────────────────
# - The approval gate lives in the ENGINES' `environment:` declarations, not in
#   this file. Do not hoist a single unbound gate job in front of them, and do
#   not weaken either engine's binding: that binding both mints the
#   environment-form OIDC subject production's roles trust AND is what asks for
#   approval. Having it in the engines is what makes the gate unbypassable.
# - The operational rules — two approval clicks per run, approve the newest
#   parked run only, image provenance — are generated into every run's summary
#   by the `changes` job below, where the approver actually reads them.
#   Maintain them THERE, not in a comment here.
#
# The gate in full:
# docs/infrastructure/pipelines.md#production-every-deploy-needs-approval.

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Preview the infrastructure changes without applying or deploying anything"
        type: boolean
        default: false
      deployed_image:
        description: >-
          Optional. Overrides the image the infrastructure converge feeds the
          two task-definition families — the escape hatch for the engine's
          refusal guard, for when a live service exists but the image it is
          serving cannot be discovered. It pins nothing durably: on any run that
          is not plan-only, the app job builds THIS commit and re-registers both
          families against that fresh image minutes later, and a plan-only run
          applies nothing at all. The URI must reference an image in THIS
          environment's own ECR registry; supplying another environment's image
          is cross-environment promotion, which the provenance rule above
          forbids.
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # What kind of run is this? Pure git and pure bash — no credentials, no AWS,
  # and deliberately no `environment:` key, so this job runs immediately while
  # the rest of the run waits at the gate. Its step summary is what the approver
  # reads before clicking.
  changes:
    name: Decide the mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The push range is diffed below and the default shallow fetch has
          # only the tip commit, which would make every diff fail.
          fetch-depth: 0

      - name: Decide the mode
        id: mode
        env:
          # Mapped into the environment rather than interpolated into the script
          # body: a ref or SHA is attacker-influenceable text, and `${{ }}`
          # inside a run block is textual substitution.
          EVENT_NAME: ${{ github.event_name }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A human at the dispatch button is asking for one of exactly two
            # things: show me what would change, or make it so.
            if [ "$PLAN_ONLY" = "true" ]; then
              MODE="plan"
            else
              MODE="apply"
            fi
            echo "Manual dispatch — mode '$MODE'."
          else
            # `github.event.before` is all-zeros when the branch was just
            # created, and points at a commit that no longer exists after a
            # force push or once the base has been garbage-collected. In all
            # three cases the diff is unknowable, so take the full path:
            # converging is idempotent, and a needless apply is much cheaper
            # than a missed one.
            UNKNOWN_BASE=""
            if [ -z "$BEFORE" ]; then
              UNKNOWN_BASE="no before-SHA on the event"
            elif ! printf '%s' "$BEFORE" | grep -qE '[^0]'; then
              UNKNOWN_BASE="all-zeros before-SHA (new branch)"
            elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              UNKNOWN_BASE="before-SHA $BEFORE is not in this repository (force push or GC)"
            fi

            if [ -n "$UNKNOWN_BASE" ]; then
              echo "Cannot diff the push range: $UNKNOWN_BASE. Defaulting to apply."
              MODE="apply"
            else
              # Written to a file rather than piped into grep: with pipefail on,
              # `grep -q` exiting early can leave the writer killed by SIGPIPE
              # and turn a match into a nonzero pipeline.
              git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed-files.txt

              echo "::group::Changed files"
              cat /tmp/changed-files.txt
              echo "::endgroup::"

              # Anything that can change what terraform would build: the
              # environment roots and the shared module beneath them, plus the
              # engines and this trigger themselves — a change to the pipeline
              # should be exercised on the run that introduces it, not on the
              # next unrelated merge.
              if grep -qE '^(infrastructure/terraform/|\.github/workflows/(iac-deploy|app-deploy|deploy-production)\.yml$)' /tmp/changed-files.txt; then
                echo "Infrastructure-relevant paths changed — mode 'apply'."
                MODE="apply"
              else
                echo "No infrastructure-relevant paths changed — mode 'read'."
                MODE="read"
              fi
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # This job binds no Environment, so it finishes while the run is still
      # parked at the approval gate — which makes its summary visible on the run
      # page at exactly the moment the approver is deciding. That is the point.
      - name: Write the approver's notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -o pipefail

          # Not `git rev-parse --short`: the abbreviation length it picks depends
          # on the clone, so this fetch-depth-0 checkout can produce a longer
          # prefix than the app engine's shallow one. Seven characters, always.
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-7)

          case "$EVENT_NAME" in
            push) TRIGGERED_BY="a push to \`production\`" ;;
            workflow_dispatch) TRIGGERED_BY="a manual dispatch" ;;
            *) TRIGGERED_BY="\`$EVENT_NAME\`" ;;
          esac

          {
            echo "## Before you approve — production"
            echo ""
            if [ "$MODE" = "plan" ]; then
              echo "**This is a plan-only run** for commit \`$SHA\`: it previews the"
              echo "infrastructure changes and deploys nothing. Started by"
              echo "$TRIGGERED_BY."
            else
              echo "**This run deploys commit \`$SHA\`**, started by $TRIGGERED_BY."
              echo "Expected image tag \`$SHORT_SHA\` — the commit's short SHA; the"
              echo "exact tag is recorded in the app job's deploy summary once"
              echo "built."
            fi
            echo ""
            echo "Mode: \`$MODE\`."
            echo ""
            echo "**Approve the newest run only.** Successive merges to"
            echo "\`production\` park successive runs, and approving an older parked"
            echo "run deploys an older commit over a newer one. Auto-cancel does not"
            echo "reliably clean parked runs up — a run waiting at an approval gate is"
            echo "\"waiting\", not \"in progress\" — so stale parked runs accumulate."
            echo "Approve the newest, reject or cancel the rest."
            echo ""
            if [ "$MODE" = "plan" ]; then
              echo "**Expect one approval prompt for this run.** The required-reviewers"
              echo "gate is per job, not per run, and a plan-only run has exactly one"
              echo "environment-bound job: the infrastructure engine, in plan mode. The"
              echo "app job is skipped, so no image is built and nothing is deployed."
              echo "Approving publishes a plan to the run summary and applies nothing."
            else
              echo "**Expect two approval prompts for this run.** The required-reviewers"
              echo "gate is per job, not per run, and this run has two"
              echo "environment-bound jobs: infrastructure, then app. The app job only"
              echo "reaches the gate once the infrastructure job has finished, so a"
              echo "second request appears mid-run. That is expected — the environment"
              echo "binding on each engine job is what scopes the OIDC credentials and"
              echo "enforces this gate, and it is deliberately not weakened to save a"
              echo "click."
              echo ""
              echo "**Image provenance.** This run builds production's image from this"
              echo "production-branch commit into production's own ECR repository."
              echo "Images built for development are never promoted across"
              echo "environments."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Always runs: `mode` decides how much work it does, not whether it runs at
  # all — a skipped job emits no outputs, and the app job below needs the six
  # names it produces. This is the job that first meets the approval gate,
  # because it is the first one to bind the `production` Environment.
  infra:
    needs: changes
    uses: ./.github/workflows/iac-deploy.yml
    with:
      environment: production
      mode: ${{ needs.changes.outputs.mode }}
      # Empty in the normal case, so the engine uses whatever the live service
      # is serving. Non-empty only when a dispatcher supplied an override.
      deployed_image: ${{ inputs.deployed_image || '' }}
    # Environment-scoped secrets resolve against the environment the CALLED job
    # binds, so `inherit` is how IAC_APPLY_ROLE_ARN reaches the engine without
    # this file naming it.
    secrets: inherit

  # Every merge ships the app; only a plan-only dispatch skips it. The six names
  # come from state, read at run time by the job above — nothing here is
  # hand-set, and none of it is stored in repository settings.
  #
  # `needs` does the rest: a failed infra job skips this one, so the app is
  # never shipped on top of a failed converge. This job binds the Environment
  # too, which is why approval is requested a second time here.
  app:
    needs: [changes, infra]
    if: ${{ needs.changes.outputs.mode != 'plan' }}
    uses: ./.github/workflows/app-deploy.yml
    with:
      environment: production
      aws_region: ${{ needs.infra.outputs.aws_region }}
      ecr_repository: ${{ needs.infra.outputs.ecr_repository }}
      ecs_cluster: ${{ needs.infra.outputs.ecs_cluster }}
      ecs_service: ${{ needs.infra.outputs.ecs_service }}
      admin_task_family: ${{ needs.infra.outputs.admin_task_family }}
      publish_task_family: ${{ needs.infra.outputs.publish_task_family }}
    secrets: inherit
