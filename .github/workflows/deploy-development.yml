name: Deploy development

# The development environment's trigger. It holds no deployment logic of its
# own: it decides WHEN and in WHICH MODE the two shared engines run, and wires
# the infrastructure engine's outputs into the app engine.
#
#   changes -> iac-deploy.yml (always) -> app-deploy.yml (every merge)
#
# ── Why the infrastructure job always runs ───────────────────────────────────
# The obvious design — "skip the infrastructure job when no terraform files
# changed" — does not work. A skipped job emits no outputs on GitHub, so the app
# job would receive six empty names and fail on the very merges that touch no
# infrastructure, which is most of them. Path-awareness therefore gates the
# MODE, not the job: an app-only merge still runs the engine in `read` mode
# (init, read the state outputs, describe nothing, change nothing), and a merge
# that touches infrastructure runs it in `apply` mode. The app job's inputs are
# never empty because the job producing them never skips.
#
# ── Concurrency ──────────────────────────────────────────────────────────────
# One group for the whole composed run, queued rather than cancelled: an apply
# interrupted halfway leaves state locked and infrastructure half-converged, and
# a cancelled app job leaves a rollout mid-flight. Neither engine carries a
# group of its own precisely so this one can span both.
#
# Honest about what GitHub actually guarantees: it keeps at most ONE pending run
# per group and supersedes an older pending run when a newer one arrives. So
# with three merges in quick succession the middle one can be dropped. That is
# safe here — a later push to `development` contains the earlier push's commits,
# so the run that does execute deploys a superset. What can never happen, which
# is the property that matters, is two runs converging the same environment at
# the same time.
#
# ── Coexistence with the legacy pipeline ─────────────────────────────────────
# `deploy-lean.yml` still deploys the existing staging environment and is
# deliberately untouched. The two read disjoint configuration — deploy-lean uses
# repository-level `AWS_REGION`/`ECR_REPOSITORY`/… variables and the
# `AWS_DEPLOY_ROLE_ARN` secret, this pipeline uses Environment-scoped `IAC_*`
# values — so neither can accidentally drive the other's environment. Retiring
# deploy-lean is an explicit later step of the rebuild, never a side effect of
# this file.

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Preview the infrastructure changes without applying or deploying anything"
        type: boolean
        default: false

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # What kind of run is this? Pure git and pure bash — no credentials, no AWS.
  changes:
    name: Decide the mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The push range is diffed below and the default shallow fetch has
          # only the tip commit, which would make every diff fail.
          fetch-depth: 0

      - name: Decide the mode
        id: mode
        env:
          # Mapped into the environment rather than interpolated into the script
          # body: a ref or SHA is attacker-influenceable text, and `${{ }}`
          # inside a run block is textual substitution.
          EVENT_NAME: ${{ github.event_name }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A human at the dispatch button is asking for one of exactly two
            # things: show me what would change, or make it so.
            if [ "$PLAN_ONLY" = "true" ]; then
              MODE="plan"
            else
              MODE="apply"
            fi
            echo "Manual dispatch — mode '$MODE'."
          else
            # `github.event.before` is all-zeros when the branch was just
            # created, and points at a commit that no longer exists after a
            # force push or once the base has been garbage-collected. In all
            # three cases the diff is unknowable, so take the full path:
            # converging is idempotent, and a needless apply is much cheaper
            # than a missed one.
            UNKNOWN_BASE=""
            if [ -z "$BEFORE" ]; then
              UNKNOWN_BASE="no before-SHA on the event"
            elif ! printf '%s' "$BEFORE" | grep -qE '[^0]'; then
              UNKNOWN_BASE="all-zeros before-SHA (new branch)"
            elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              UNKNOWN_BASE="before-SHA $BEFORE is not in this repository (force push or GC)"
            fi

            if [ -n "$UNKNOWN_BASE" ]; then
              echo "Cannot diff the push range: $UNKNOWN_BASE. Defaulting to apply."
              MODE="apply"
            else
              # Written to a file rather than piped into grep: with pipefail on,
              # `grep -q` exiting early can leave the writer killed by SIGPIPE
              # and turn a match into a nonzero pipeline.
              git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed-files.txt

              echo "::group::Changed files"
              cat /tmp/changed-files.txt
              echo "::endgroup::"

              # Anything that can change what terraform would build: the
              # environment roots and the shared module beneath them, plus the
              # engines and this trigger themselves — a change to the pipeline
              # should be exercised on the run that introduces it, not on the
              # next unrelated merge.
              if grep -qE '^(infrastructure/terraform/|\.github/workflows/(iac-deploy|app-deploy|deploy-development)\.yml$)' /tmp/changed-files.txt; then
                echo "Infrastructure-relevant paths changed — mode 'apply'."
                MODE="apply"
              else
                echo "No infrastructure-relevant paths changed — mode 'read'."
                MODE="read"
              fi
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  # Always runs — see the header. `mode` decides how much work it does, not
  # whether it runs at all.
  infra:
    needs: changes
    uses: ./.github/workflows/iac-deploy.yml
    with:
      environment: development
      mode: ${{ needs.changes.outputs.mode }}
    # Environment-scoped secrets resolve against the environment the CALLED job
    # binds, so `inherit` is how IAC_APPLY_ROLE_ARN reaches the engine without
    # this file naming it.
    secrets: inherit

  # Every merge ships the app; only a plan-only dispatch skips it. The six names
  # come from state, read at run time by the job above — nothing here is
  # hand-set, and none of it is stored in repository settings.
  #
  # `needs` does the rest: a failed infra job skips this one, so the app is
  # never shipped on top of a failed converge.
  app:
    needs: [changes, infra]
    if: ${{ needs.changes.outputs.mode != 'plan' }}
    uses: ./.github/workflows/app-deploy.yml
    with:
      environment: development
      aws_region: ${{ needs.infra.outputs.aws_region }}
      ecr_repository: ${{ needs.infra.outputs.ecr_repository }}
      ecs_cluster: ${{ needs.infra.outputs.ecs_cluster }}
      ecs_service: ${{ needs.infra.outputs.ecs_service }}
      admin_task_family: ${{ needs.infra.outputs.admin_task_family }}
      publish_task_family: ${{ needs.infra.outputs.publish_task_family }}
    secrets: inherit
