<!DOCTYPE html>
<html lang="en">
  <head>
    <title>#{LINK_PREVIEW_TITLE}</title>
    <meta charset="utf-8" />
    <link
      id="favicon"
      rel="shortcut icon"
      href="public/images/logos/logo.png"
    />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#1d1f20" />
    <meta name="description" content="#{LINK_PREVIEW_DESCRIPTION}" />
    <style>
      html,
      body {
        background: #1d1f20;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }

      *,
      :after,
      :before {
        box-sizing: inherit;
      }

      p {
        margin: 0 0 1em;
        line-height: 1.4285em;
      }
      h1:last-child,
      h2:last-child,
      h3:last-child,
      h4:last-child,
      h5:last-child,
      p:last-child {
        margin-bottom: 0;
      }
      h1:first-child,
      h2:first-child,
      h3:first-child,
      h4:first-child,
      h5:first-child,
      p:first-child {
        margin-top: 0;
      }
      /* Loading screen */
      .LoadingPage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 100;
        background: #f5f6f7;
        color: #1b1b1b;
        font-family: "Public Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .LoadingPage .loading {
        position: absolute;
        top: 50%;
        left: 16px;
        right: 16px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .LoadingPage .loading-spinner {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(113, 118, 122, 0.2);
        border-top-color: #71767a;
        border-radius: 50%;
        animation: loading-spin 0.9s linear infinite;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .LoadingPage .loading-text {
        font-size: 1rem;
        letter-spacing: 0.1em;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div class="LoadingPage">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
    <script>
      if(document.title.indexOf('LINK_PREVIEW_TITLE') != -1)
        document.title = "MMGIS";
      const NODE_ENV = "%NODE_ENV%";
      mmgisglobal = {};
      mmgisglobal.name = "MMGIS";
      mmgisglobal.SERVER = "%SERVER%";
      switch (NODE_ENV) {
        case "production":
          mmgisglobal.AUTH = "#{AUTH}";
          mmgisglobal.version = "#{VERSION}";
          mmgisglobal.user = "#{user}";
          mmgisglobal.permission = "#{permission}";
          mmgisglobal.groups = "#{groups}";
          mmgisglobal.NODE_ENV = "#{NODE_ENV}";
          mmgisglobal.FORCE_CONFIG_PATH = "#{FORCE_CONFIG_PATH}";
          mmgisglobal.CLEARANCE_NUMBER = "#{CLEARANCE_NUMBER}";
          mmgisglobal.HOSTS = "#{HOSTS}";
          mmgisglobal.PORT = "#{PORT}";
          mmgisglobal.ROOT_PATH = "#{ROOT_PATH}";
          mmgisglobal.WEBSOCKET_ROOT_PATH = "#{WEBSOCKET_ROOT_PATH}";
          mmgisglobal.ENABLE_MMGIS_WEBSOCKETS = "#{ENABLE_MMGIS_WEBSOCKETS}";
          mmgisglobal.MAIN_MISSION = "#{MAIN_MISSION}";
          mmgisglobal.SKIP_CLIENT_INITIAL_LOGIN = "#{SKIP_CLIENT_INITIAL_LOGIN}";
          mmgisglobal.THIRD_PARTY_COOKIES = "#{THIRD_PARTY_COOKIES}";
          mmgisglobal.IS_DOCKER = "#{IS_DOCKER}";
          mmgisglobal.WITH_TITILER = "#{WITH_TITILER}";
          break;
        default:
          mmgisglobal.AUTH = "%AUTH%";
          mmgisglobal.version = "%VERSION%";
          mmgisglobal.user = "guest";
          mmgisglobal.permission = "000";
          mmgisglobal.groups = [];
          mmgisglobal.NODE_ENV = NODE_ENV;
          mmgisglobal.FORCE_CONFIG_PATH = null;
          mmgisglobal.CLEARANCE_NUMBER = "%CLEARANCE_NUMBER%";
          mmgisglobal.PORT = "%PORT%";
          mmgisglobal.ROOT_PATH = "%ROOT_PATH%";
          mmgisglobal.WEBSOCKET_ROOT_PATH = "%WEBSOCKET_ROOT_PATH%";
          mmgisglobal.ENABLE_MMGIS_WEBSOCKETS = "%ENABLE_MMGIS_WEBSOCKETS%";
          mmgisglobal.MAIN_MISSION = "%MAIN_MISSION%";
          mmgisglobal.SKIP_CLIENT_INITIAL_LOGIN = "%SKIP_CLIENT_INITIAL_LOGIN%";
          mmgisglobal.THIRD_PARTY_COOKIES = "%THIRD_PARTY_COOKIES%";
          mmgisglobal.IS_DOCKER = "%IS_DOCKER%";
          mmgisglobal.WITH_TITILER = "%WITH_TITILER%";
          // eslint-disable-next-line
          mmgisglobal.HOSTS = %HOSTS%;
          break;
      }
      window.mmgisglobal = mmgisglobal;

      // prettier-ignore
      console.info(
            '███╗   ███╗███╗   ███╗ ██████╗ ██╗███████╗' + ' Multi-Mission\n' +
            '████╗ ████║████╗ ████║██╔════╝ ██║██╔════╝' + ' Geographical\n' +
            '██╔████╔██║██╔████╔██║██║  ███╗██║███████╗' + ' Information\n' +
            '██║╚██╔╝██║██║╚██╔╝██║██║   ██║██║╚════██║' + ' System\n' +
            '██║ ╚═╝ ██║██║ ╚═╝ ██║╚██████╔╝██║███████║' + ` v${mmgisglobal.version} (${mmgisglobal.NODE_ENV})\n` +
            '╚═╝     ╚═╝╚═╝     ╚═╝ ╚═════╝ ╚═╝╚══════╝' + ' https://github.com/NASA-AMMOS/MMGIS');
    </script>
  </body>
  <div id="main-container"></div>
  <footer></footer>
</html>
